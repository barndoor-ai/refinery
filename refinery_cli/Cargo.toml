[package]
name = "refinery_cli"
version = "0.8.16"
authors = ["Katharina Fey <kookie@spacekookie.de>", "João Oliveira <hello@jxs.pt>"]
license = "MIT OR Apache-2.0"
description = "Provides the CLI for the Refinery crate"
documentation = "https://docs.rs/refinery/"
repository = "https://github.com/rust-db/refinery"
readme = "README.md"
keywords = ["refinery", "migrations", "cli"]
edition = "2018"

[[bin]]
name = "refinery"
path = "src/main.rs"

[features]
default = ["mysql", "postgresql", "sqlite-bundled", "mssql"]
# The Postgres path builds its own `postgres::Client` with a rustls connector
# (see `src/pg_tls`), so the TLS stack is gated on this feature too — images are
# built with `--no-default-features -F postgresql`.
postgresql = [
    "refinery-core/postgres",
    "dep:percent-encoding",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio-postgres-rustls",
    "dep:webpki-roots",
]
mysql = ["refinery-core/mysql"]
sqlite = ["refinery-core/rusqlite"]
sqlite-bundled = ["sqlite", "refinery-core/rusqlite-bundled"]
mssql = ["refinery-core/tiberius-config", "tokio"]

[dependencies]
refinery-core = { version = "0.8.16", path = "../refinery_core", default-features = false, features = ["toml"] }
clap = { version = "4", features = ["derive"] }
human-panic = "2"
toml = "0.8"
env_logger = "0.11"
log = "0.4"
anyhow = "1"
regex = "1"
walkdir = "2.3.1"
cfg-if = "1.0.0"
tokio = { version = "1.0", features = ["full"], optional = true }

# Postgres TLS (see `src/pg_tls`). `ring` rather than `aws-lc-rs`: this binary
# is built statically against musl in a `FROM scratch` image, and `aws-lc-rs`
# needs cmake/nasm in the builder. There is deliberately NO direct `postgres`
# dependency — the driver types are reached through `refinery_core::postgres`,
# so the version cannot split from the one refinery-core links against.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"], optional = true }
# Query-value decoding. Named explicitly rather than reached through `url`'s
# re-export: `url::form_urlencoded` is the HTML form encoding, where `+` means a
# space, but `tokio-postgres` percent-decodes query values and leaves `+`
# literal. See `src/pg_tls/dsn.rs`'s header.
percent-encoding = { version = "2", optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
predicates = "3"
assert_cmd = "2"
tempfile = "3"

[package.metadata.deb]
name = "refinery"
maintainer = "João Oliveira <hello@jxs.pt>"
depends = "libssl-dev"
